<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord des signaux SBC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F8F7F3; font-family: system-ui, -apple-system, sans-serif; color: #1F2937; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px; }
  .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 0.08em; color: #008000; text-transform: uppercase; }
  h1 { font-size: 32px; font-weight: 800; margin: 4px 0 2px; }
  .sub { font-size: 15px; font-weight: 600; color: #4B5563; }
  .card { background: #fff; border: 1px solid #E5E7EB; border-radius: 10px; padding: 16px; }
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 20px 0; padding: 14px 16px; }
  .preset-btn { padding: 7px 14px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid #E5E7EB; background: #fff; color: #374151; }
  .preset-btn.active { border-color: #008000; background: #E8F2E8; color: #008000; font-weight: 700; }
  .divider { width: 1px; height: 24px; background: #E5E7EB; }
  input[type=date] { border: 1px solid #E5E7EB; border-radius: 6px; padding: 5px 8px; font-size: 14px; font-weight: 600; }
  .kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 14px; }
  .kpi-row-title { font-size: 14px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0.04em; margin: 18px 0 8px; }
  .kpi-card { background: #FAFAF8; border-radius: 8px; padding: 16px 10px 14px; text-align: center; overflow: hidden; }
  .kpi-bar { height: 5px; margin: -16px -10px 14px; }
  .kpi-num { font-size: 34px; font-weight: 800; line-height: 1.1; }
  .kpi-desc { font-size: 13.5px; font-weight: 600; color: #374151; margin-top: 8px; line-height: 1.3; }
  .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 20px; }
  .card-title { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
  .card-sub { font-size: 13.5px; font-weight: 600; color: #4B5563; margin-bottom: 10px; }
  .legend-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 13px; font-weight: 600; color: #374151; }
  .legend-dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { border: 1px solid #1F2937; padding: 8px 10px; font-weight: 800; color: #fff; font-size: 13.5px; }
  td { border: 1px solid #E5E7EB; padding: 7px 10px; font-weight: 500; }
  .foot-note { font-size: 12px; font-weight: 600; color: #9CA3AF; margin-top: 8px; }
  .table-card { overflow-x: auto; margin-bottom: 20px; }
  #status { font-size: 15px; font-weight: 600; color: #6B7280; padding: 40px 0; text-align: center; }
  .favoris-title { font-weight: 700; color: #8A7B00; margin: 0 0 6px; font-size: 13.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .favoris-columns { columns: 3 260px; column-gap: 24px; }
  .favoris-line { font-weight: 600; color: #1F2937; margin: 0 0 3px; break-inside: avoid; }
  .tabs { display: flex; gap: 4px; margin-top: 18px; border-bottom: 2px solid #E5E7EB; }
  .tab-btn { padding: 10px 18px; font-size: 15px; font-weight: 700; color: #4B5563; background: none; border: none; border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; }
  .tab-btn.active { color: #008000; border-bottom-color: #008000; }
  .tab-btn:focus-visible, .preset-btn:focus-visible, select:focus-visible, #login button:focus-visible, #login input:focus-visible { outline: 2px solid #008000; outline-offset: 2px; }
  select { border: 1px solid #E5E7EB; border-radius: 6px; padding: 6px 8px; font-size: 14px; font-weight: 600; background: #fff; color: #1F2937; }
  #region-filter { display: none; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  #login .card { width: 100%; max-width: 380px; padding: 28px 24px; }
  #login h1 { font-size: 24px; margin: 4px 0 18px; }
  #login label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  #login input { width: 100%; border: 1px solid #D1D5DB; border-radius: 6px; padding: 10px 12px; font-size: 16px; }
  #login button { width: 100%; margin-top: 14px; padding: 10px; border: none; border-radius: 6px; background: #008000; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  #login-error { color: #C62828; font-size: 14px; font-weight: 600; margin-top: 10px; min-height: 20px; }
  @media (max-width: 760px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <div class="eyebrow">Surveillance à base communautaire</div>
    <h1>Tableau de bord des signaux SBC</h1>
    <label for="login-pass">Mot de passe</label>
    <input type="password" id="login-pass" autocomplete="current-password" autofocus>
    <button type="button" id="login-btn">Se connecter</button>
    <div id="login-error" role="alert"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none;">
  <header>
    <div class="eyebrow">Surveillance à base communautaire</div>
    <h1>Tableau de bord des signaux SBC</h1>
    <div class="sub" id="header-sub">Chargement…</div>
    <nav class="tabs" role="tablist">
      <button class="tab-btn active" role="tab" data-view="national">Vue nationale</button>
      <button class="tab-btn" role="tab" data-view="regional">Vue régionale</button>
    </nav>
  </header>

  <div id="status">Chargement des données…</div>
  <div id="content" style="display:none;">

    <div class="card filters">
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="preset-btn" data-preset="7j">7 derniers jours</button>
        <button class="preset-btn" data-preset="30j">30 derniers jours</button>
        <button class="preset-btn" data-preset="cumul">Cumul annuel</button>
      </div>
      <div class="divider"></div>
      <div style="display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600;">
        <span>Du</span>
        <input type="date" id="date-debut">
        <span>au</span>
        <input type="date" id="date-fin">
      </div>
      <div id="region-filter">
        <div class="divider"></div>
        <label for="region-select">Région</label>
        <select id="region-select"></select>
      </div>
    </div>

    <div id="view-national"></div>
    <div id="view-regional" style="display:none;"></div>

  </div>
</div>

<script>
const REGIONS_CM = [
  { region: 'Adamaoua', abbr: 'AD' }, { region: 'Centre', abbr: 'CE' },
  { region: 'Est', abbr: 'ES' }, { region: 'Extreme-Nord', abbr: 'EN' },
  { region: 'Littoral', abbr: 'LIT' }, { region: 'Nord', abbr: 'NO' },
  { region: 'Nord-Ouest', abbr: 'NW' }, { region: 'Ouest', abbr: 'OU' },
  { region: 'Sud', abbr: 'SU' }, { region: 'Sud-Ouest', abbr: 'SW' },
];

const REGION_COLOR = {
  Centre: '#1F2937', Sud: '#0A2E0A', 'Nord-Ouest': '#2E5EAA', Nord: '#D97706',
  Ouest: '#C0392B', 'Sud-Ouest': '#D6559C', 'Extreme-Nord': '#7C3AED',
  Adamaoua: '#0E7490', Littoral: '#65A30D', Est: '#92400E',
};

const DICO_EVENEMENTS = {
  DAA: 'Diarrhée aqueuse aiguë (toutes formes)', DRA: 'Maladie du ver de Guinée (dracunculose)',
  FHV: 'Fièvre hémorragique virale', FJA: 'Fièvre jaune', MEN: 'Méningite',
  RAG: 'Rage (humaine)', ENV: 'Envenimation', PFA: 'Paralysie flasque aiguë',
  ROU: 'Rougeole', SRA: 'Syndrome respiratoire aigu sévère', TNN: 'Tétanos néonatal',
  MPO: 'Mpox / Variole du singe', DEM: 'Décès maternel', DNN: 'Décès néonatal', DEN: 'Décès néonatal',
  TNE: 'Tétanos néonatal', VAS: 'Mpox / Variole du singe',
  MOR: 'Morsures animales (chiens, serpents…)', GRI: 'Grippe',
};

// ------------------------------------------------------------
// NIVEAU 1 : classification du commentaire libre (sbc_commentaires)
// Reproduit classifier_vectorise() du script R. Liste "themes"
// partielle à ce stade (3 catégories confirmées) — à compléter
// au fur et à mesure que le reste du script R est transmis.
// ------------------------------------------------------------

const THEMES_COMMENTAIRE = [
  ['AVP (Accidents, agressions)', [
    'accident', 'blessure', 'bless[ée]', 'couteau', 'traumatisme',
    'br[ûu]lure', 'chute', 'carreaux', 'electrocution',
    'fracture', '\\bavp\\b', '\\bmoto\\b', 'plaie', 'coupure',
  ]],
  ['Intoxications alimentaires', [
    'intoxication', 'aliment', 'souill[ée]', 'empoisonnement',
    'consomm[ée]', 'alimentaire',
  ]],
];

// Commentaires assimilés à "vide" — enrichie avec les valeurs réellement
// observées dans les données (ras: 453 occurrences, test: 56, etc.)
const TRIVIAL = [
  '', '-', '.', '0', 'rien', 'aucun', 'rar', 'neant', 'néant', 'na', 'n/a',
  'ras', 'r.a.s', 'r.a.s.', 'rien à signaler', 'test', 'texte',
];

function classifierVectorise(commentaire) {
  const c = (commentaire || '').trim().toLowerCase();
  if (!c || TRIVIAL.includes(c)) return null; // commentaire vide/trivial -> non concluant
  for (const [theme, mots] of THEMES_COMMENTAIRE) {
    if (new RegExp(mots.join('|'), 'i').test(c)) return theme;
  }
  return 'Autres / inclassifiables';
}



const MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function fmtDate(d) { const [y,m,day] = d.split('-').map(Number); return `${day} ${MOIS_FR[m-1]} ${y}`; }
function isoDaysAgo(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - days);
  return toISO(d);
}
// Formate une Date en "AAAA-MM-JJ" à partir de ses composants LOCAUX
// (toISOString() convertit en UTC et peut décaler d'un jour selon le
// fuseau horaire du navigateur — on l'évite volontairement ici).
function toISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function todayISO() { return toISO(new Date()); }

function typeSignal(sbcType) {
  const t = (sbcType || '').trim().toUpperCase();
  if (/^SH[1-9]$/.test(t)) return 'Hospitaliers';
  if (/CENTRE D'APPEL/i.test(sbcType || '')) return "Centre d'appel";
  return 'Communautaires';
}

// Reproduit exactement le filtre du script R :
// base_verifie <- base %>% filter(sbc_code_d_acces_au_tirage_et_verification == "HASVC")
// Égalité stricte — aucune variante/faute de frappe n'est acceptée.
function isVerifie(code) {
  return (code || '').trim().toUpperCase() === 'HASVC';
}

function evenementFinal(row) {
  // Niveau 1 : commentaire libre (AVP et Intoxications alimentaires uniquement)
  const commentaire = row[8] || '';
  const theme1 = classifierVectorise(commentaire);
  if (theme1 && theme1 !== 'Autres / inclassifiables') return theme1;

  // Niveau 2 : champ "événement retenu" (code officiel)
  const retenu = (row[6] || '').trim().toUpperCase();
  if (retenu && DICO_EVENEMENTS[retenu]) return DICO_EVENEMENTS[retenu];

  // Niveau 3 : sbc_type, en excluant les codes de canal (SH*/SC*)
  const type = (row[5] || '').trim().toUpperCase();
  const estCanal = /^SH/.test(type) || /^SC/.test(type);
  if (!estCanal && DICO_EVENEMENTS[type]) return DICO_EVENEMENTS[type];

  return 'Autres / inclassifiables';
}


// ============================================================
// CONNEXION PAR MOT DE PASSE (sans nom d'utilisateur)
// ------------------------------------------------------------
// Simple écran d'accès : il masque le tableau de bord mais ne
// protège pas réellement les données (data/signals.json reste
// accessible directement). On stocke l'empreinte SHA-256 du mot
// de passe plutôt que le mot de passe lui-même.
// Pour changer le mot de passe, ouvrez la console du navigateur
// (F12) sur la page et tapez :  await sha256('nouveau-mot-de-passe')
// puis collez le résultat ci-dessous.
// ============================================================
const PASSWORD_HASH = 'da6c60d58250f244e8e2d8158d685a375dd543bafbf004cea09a3f9604bcad53';
const AUTH_KEY = 'sbc-auth';

async function sha256(texte) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texte));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function ouvrirApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  init();
}

async function tenterConnexion() {
  const input = document.getElementById('login-pass');
  const err = document.getElementById('login-error');
  if (!input.value) { err.textContent = 'Saisissez le mot de passe.'; return; }
  const h = await sha256(input.value);
  if (h === PASSWORD_HASH) {
    try { sessionStorage.setItem(AUTH_KEY, h); } catch (e) {}
    ouvrirApp();
  } else {
    err.textContent = 'Mot de passe incorrect.';
    input.select();
  }
}

document.getElementById('login-btn').addEventListener('click', tenterConnexion);
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') tenterConnexion(); });

// ============================================================
// DEUX FEUILLES : vue nationale (unité = région) et vue
// régionale (unité = district de santé, filtre par région,
// Centre par défaut). Mêmes sections dans les deux vues.
// ============================================================
const VIEWS = {
  national: { id: 'national', p: 'n-', regional: false, unitIdx: 2, unitLabel: 'Région' },
  regional: { id: 'regional', p: 'r-', regional: true, unitIdx: 3, unitLabel: 'District' },
};
const REGION_DEFAUT = 'Centre';

let RAW = [];
let MIN_DATE, MAX_DATE, TODAY;
let dateDebut, dateFin, preset = '7j';
let vueActive = 'national';
let regionChoisie = REGION_DEFAUT;
const CHARTS = {};

function kpiCard(id, color, desc, descId) {
  return `<div class="kpi-card"><div class="kpi-bar" style="background:${color};"></div>
    <div class="kpi-num" style="color:${color};" id="${id}">-</div>
    <div class="kpi-desc"${descId ? ` id="${descId}"` : ''}>${desc}</div></div>`;
}

function kpiRow(p, k, cumul, v) {
  const pre = cumul ? 'Cumul signaux' : 'Signaux';
  const dernier = v.regional ? 'Aires de santé actives' : 'Régions ayant remonté des signaux';
  return `<div class="kpi-row">
    ${kpiCard(`${p}${k}-total`, '#008000', cumul ? 'Cumul signaux enregistrés' : 'Signaux enregistrés')}
    ${kpiCard(`${p}${k}-actifs`, '#D6A700', `${pre} actifs`, `${p}${k}-actifs-sub`)}
    ${kpiCard(`${p}${k}-completes`, '#008000', `${pre} traités`, `${p}${k}-completes-sub`)}
    ${kpiCard(`${p}${k}-ds`, '#808080', 'Districts sanitaires actifs')}
    ${kpiCard(`${p}${k}-last`, '#C62828', dernier)}
  </div>`;
}

function sectionsHTML(v) {
  const p = v.p;
  const unite = v.regional ? 'district' : 'région';
  return `
    <div class="kpi-row-title" id="${p}kpi-title-cumul"></div>
    ${kpiRow(p, 'kpiC', true, v)}
    <div class="kpi-row-title" id="${p}kpi-title"></div>
    ${kpiRow(p, 'kpiP', false, v)}

    <div class="grid-2">
      <div class="card">
        <div class="card-title">${v.regional ? 'Répartition des signaux par district' : 'Répartition des signaux par district (top 15)'}</div>
        <div class="card-sub" id="${p}chart1-sub"></div>
        <div style="position:relative; height:360px;">
          <canvas id="${p}chartDistricts" role="img" aria-label="Répartition en pourcentage des signaux par district"></canvas>
        </div>
        <div class="legend-row" id="${p}legend-regions"></div>
      </div>
      <div class="card">
        <div class="card-title">Type de signal</div>
        <div class="card-sub" id="${p}chart2-sub"></div>
        <div style="position:relative; height:230px;">
          <canvas id="${p}chartType" role="img" aria-label="Répartition des signaux par type"></canvas>
        </div>
        <div id="${p}legend-type" style="display:flex; flex-direction:column; gap:6px; margin-top:8px; font-size:14px; font-weight:600;"></div>
      </div>
    </div>

    <div class="card table-card">
      <div class="card-title">Signaux par ${unite}</div>
      <table id="${p}table-unites"></table>
      <div class="foot-note">Source : DHIS2</div>
    </div>

    <div id="${p}favoris" style="display:none;"></div>

    <div class="card table-card">
      <div class="card-title">Evénement — surveillance SFE/SBC</div>
      <div class="card-sub" id="${p}table2-sub"></div>
      <table id="${p}table-events"></table>
      <div class="foot-note">Source : DHIS2</div>
    </div>

    <div class="card table-card">
      <div class="card-title">Performance de la surveillance — délais de traitement par ${unite}</div>
      <div class="card-sub" id="${p}table-delais-sub"></div>
      <table id="${p}table-delais"></table>
      <div class="foot-note">Source : DHIS2 </div>
    </div>`;
}

const $ = id => document.getElementById(id);

async function init() {
  try {
    const res = await fetch('data/signals.json?t=' + Date.now());
    RAW = await res.json();
  } catch (e) {
    $('status').textContent = "Impossible de charger les données (data/signals.json). " + e.message;
    return;
  }
  if (!RAW.length) {
    $('status').textContent = "Aucune donnée disponible pour le moment.";
    return;
  }
  const dates = RAW.map(r => r[0]).filter(Boolean).sort();
  MIN_DATE = dates[0]; MAX_DATE = dates[dates.length - 1];
  TODAY = todayISO();
  dateDebut = isoDaysAgo(TODAY, 6);
  dateFin = TODAY;

  $('view-national').innerHTML = sectionsHTML(VIEWS.national);
  $('view-regional').innerHTML = sectionsHTML(VIEWS.regional);

  const regions = Array.from(new Set(RAW.map(r => r[2]).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'fr'));
  if (!regions.includes(regionChoisie)) regionChoisie = regions[0];
  $('region-select').innerHTML = regions.map(r => `<option value="${r}"${r === regionChoisie ? ' selected' : ''}>${r}</option>`).join('');
  $('region-select').addEventListener('change', e => { regionChoisie = e.target.value; render(); });

  $('date-debut').value = dateDebut;
  $('date-fin').value = dateFin;
  $('date-debut').min = MIN_DATE;
  $('date-fin').max = TODAY;
  $('header-sub').textContent =
    `${RAW.length.toLocaleString('fr-FR')} signaux au total · du ${fmtDate(MIN_DATE)} au ${fmtDate(MAX_DATE)}`;

  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
  });
  $('date-debut').addEventListener('change', e => { dateDebut = e.target.value; preset = 'perso'; setActivePreset(); render(); });
  $('date-fin').addEventListener('change', e => { dateFin = e.target.value; preset = 'perso'; setActivePreset(); render(); });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => changerVue(btn.dataset.view));
  });

  setActivePreset();
  $('status').style.display = 'none';
  $('content').style.display = 'block';
  render();
}

function changerVue(vue) {
  vueActive = vue;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.view === vue));
  $('view-national').style.display = vue === 'national' ? 'block' : 'none';
  $('view-regional').style.display = vue === 'regional' ? 'block' : 'none';
  $('region-filter').style.display = vue === 'regional' ? 'flex' : 'none';
  render();
}

function applyPreset(p) {
  preset = p;
  if (p === '7j') { dateDebut = isoDaysAgo(TODAY, 6); dateFin = TODAY; }
  else if (p === '30j') { dateDebut = isoDaysAgo(TODAY, 29); dateFin = TODAY; }
  else if (p === 'cumul') { dateDebut = MIN_DATE; dateFin = TODAY; }
  $('date-debut').value = dateDebut;
  $('date-fin').value = dateFin;
  setActivePreset();
  render();
}

function setActivePreset() {
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.preset === preset);
  });
}

// On ne dessine que la feuille visible (Chart.js a besoin d'un
// conteneur affiché pour calculer la taille des graphiques).
function render() {
  const v = VIEWS[vueActive];
  const baseRows = v.regional ? RAW.filter(r => r[2] === regionChoisie) : RAW;
  const periodRows = baseRows.filter(r => r[0] && r[0] >= dateDebut && r[0] <= dateFin);
  const labelPeriode = `${fmtDate(dateDebut)} au ${fmtDate(dateFin)}`;
  const suffixe = v.regional ? ` — région ${regionChoisie}` : '';

  renderKpis(v, 'kpiC', baseRows, `Depuis le début de l'année ${MAX_DATE.slice(0,4)} (cumul, non filtré)${suffixe}`, 'kpi-title-cumul');
  renderKpis(v, 'kpiP', periodRows, `Sur la période sélectionnée : ${labelPeriode}${suffixe}`, 'kpi-title');

  $(`${v.p}chart1-sub`).textContent = labelPeriode;
  $(`${v.p}chart2-sub`).textContent = labelPeriode;

  renderTableUnites(v, periodRows, baseRows, labelPeriode);
  renderFavoris(v, periodRows);
  renderChartDistricts(v, periodRows);
  renderChartType(v, periodRows);
  renderTableEvents(v, periodRows, baseRows, labelPeriode);
  renderTableDelais(v, periodRows, labelPeriode);
}

function renderKpis(v, k, rows, titleText, titleElId) {
  const p = v.p;
  const total = rows.length;
  const actifs = rows.filter(r => r[1] === 'ACTIVE').length;
  const completes = rows.filter(r => r[1] === 'COMPLETED').length;
  const dsActifs = new Set(rows.map(r => `${r[2]}|${r[3]}`)).size;
  const pctActifs = total ? (actifs / total * 100).toFixed(0) : 0;
  const pctCompletes = total ? (completes / total * 100).toFixed(0) : 0;

  $(`${p}${titleElId}`).textContent = titleText;
  $(`${p}${k}-total`).textContent = total.toLocaleString('fr-FR');
  $(`${p}${k}-actifs`).textContent = actifs.toLocaleString('fr-FR');
  $(`${p}${k}-actifs-sub`).textContent = `Signaux actifs (${pctActifs} %)`;
  $(`${p}${k}-completes`).textContent = completes.toLocaleString('fr-FR');
  $(`${p}${k}-completes-sub`).textContent = `Signaux traités (${pctCompletes} %)`;
  $(`${p}${k}-ds`).textContent = dsActifs.toLocaleString('fr-FR');
  if (v.regional) {
    $(`${p}${k}-last`).textContent = new Set(rows.map(r => `${r[3]}|${r[4]}`)).size.toLocaleString('fr-FR');
  } else {
    $(`${p}${k}-last`).textContent = `${new Set(rows.map(r => r[2])).size} / 10`;
  }
}

// Vue nationale : une ligne par région (liste fixe des 10 régions),
// dernière colonne = districts ayant capté des signaux.
// Vue régionale : une ligne par district de la région, dernière
// colonne = aires de santé ayant capté des signaux.
function renderTableUnites(v, periodRows, cumulRows, labelPeriode) {
  const ui = v.unitIdx, si = ui + 1;
  const byPeriode = {}, byCumul = {}, subByPeriode = {};
  periodRows.forEach(r => {
    byPeriode[r[ui]] = (byPeriode[r[ui]] || 0) + 1;
    (subByPeriode[r[ui]] = subByPeriode[r[ui]] || new Set()).add(r[si]);
  });
  cumulRows.forEach(r => { byCumul[r[ui]] = (byCumul[r[ui]] || 0) + 1; });

  let unites;
  if (v.regional) {
    unites = Object.keys(byCumul).filter(Boolean).map(ds => ({ key: ds, label: ds }));
    unites.sort((a, b) => (byPeriode[b.key] || 0) - (byPeriode[a.key] || 0)
      || (byCumul[b.key] || 0) - (byCumul[a.key] || 0)
      || a.label.localeCompare(b.label, 'fr'));
  } else {
    unites = REGIONS_CM.map(({ region, abbr }) => ({ key: region, label: abbr }));
  }

  const rows = unites.map(u => ({
    label: u.label,
    periode: byPeriode[u.key] || 0,
    cumul: byCumul[u.key] || 0,
    observations: subByPeriode[u.key] ? Array.from(subByPeriode[u.key]).filter(Boolean).sort().join(', ') : '',
  }));
  const total = { label: 'Total', periode: rows.reduce((s,r)=>s+r.periode,0), cumul: rows.reduce((s,r)=>s+r.cumul,0), observations: '', isTotal: true };
  rows.push(total);

  const yr = MAX_DATE.slice(0,4);
  const titre1 = v.regional ? 'Districts' : 'Régions';
  const titreObs = v.regional ? 'AS ayant capté des signaux/cas communautaires' : 'DS ayant capté des signaux/cas communautaires';
  let html = `<thead>
    <tr>
      <th rowspan="2" style="background:#008000;color:#fff;text-align:left;">${titre1}</th>
      <th style="background:#A9D18E;color:#1F2937;text-align:center;">${labelPeriode}</th>
      <th style="background:#0A2E0A;text-align:center;">Cumul ${yr}</th>
      <th rowspan="2" style="background:#008000;color:#fff;text-align:left;">${titreObs}, ${labelPeriode}</th>
    </tr>
    <tr>
      <th style="background:#008000;text-align:center;">DHIS2</th>
      <th style="background:#008000;text-align:center;">DHIS2</th>
    </tr>
  </thead><tbody>`;
  rows.forEach((r,i) => {
    html += `<tr style="font-weight:${r.isTotal?800:600}; background:${i%2===0 && !r.isTotal ? '#FAFAF8':'#fff'};">
      <td>${r.label}</td>
      <td style="text-align:center; font-weight:800;">${r.periode}</td>
      <td style="text-align:center; font-weight:800;">${r.cumul}</td>
      <td style="color:#374151; font-weight:500;">${r.observations}</td>
    </tr>`;
  });
  html += '</tbody>';
  $(`${v.p}table-unites`).innerHTML = html;
}

// Liste de vigilance : district (région) : n évènements de <événement>.
// En vue régionale, la région est implicite et n'est pas répétée.
function renderFavoris(v, periodRows) {
  const el = $(`${v.p}favoris`);
  if (!el) return;

  const verifRows = periodRows.filter(r => isVerifie(r[7]));
  const counts = {};
  verifRows.forEach(r => {
    const ev = evenementFinal(r);
    if (ev === 'Autres / inclassifiables') return;
    const key = `${r[3]}|${r[2]}|${ev}`;
    counts[key] = (counts[key] || 0) + 1;
  });

  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (entries.length === 0) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }

  el.style.display = 'block';
  const lines = entries.map(([key, n]) => {
    const [district, region, ev] = key.split('|');
    const lieu = v.regional ? district : `${district} (${region})`;
    return `<div class="favoris-line">${lieu} : ${n} évènement${n>1?'s':''} de ${ev}</div>`;
  }).join('');
  el.innerHTML = `<div class="favoris-title">À surveiller — évènements par district sur la période</div>
    <div class="favoris-columns">${lines}</div>`;
}

function renderChartDistricts(v, periodRows) {
  const counts = {};
  periodRows.forEach(r => { const key = `${r[2]}|${r[3]}`; counts[key] = (counts[key]||0)+1; });
  const total = periodRows.length || 1;
  let data = Object.entries(counts).map(([key,n]) => {
    const [region, ds] = key.split('|');
    return { region, ds, label: v.regional ? ds : `${region} - ${ds}`, n, pct: n/total*100 };
  }).sort((a,b) => b.pct - a.pct);
  if (!v.regional) data = data.slice(0,15);

  const legend = $(`${v.p}legend-regions`);
  if (v.regional) {
    legend.innerHTML = '';
  } else {
    const usedRegions = new Set(data.map(d => d.region));
    legend.innerHTML = Array.from(usedRegions).map(r =>
      `<span><span class="legend-dot" style="background:${REGION_COLOR[r]||'#9CA3AF'}"></span>${r}</span>`
    ).join('');
  }

  const cle = `${v.p}districts`;
  if (CHARTS[cle]) CHARTS[cle].destroy();
  CHARTS[cle] = new Chart($(`${v.p}chartDistricts`), {
    type: 'bar',
    data: {
      labels: data.map(d => d.label),
      datasets: [{ data: data.map(d => d.pct), backgroundColor: data.map(d => REGION_COLOR[d.region] || '#9CA3AF'), borderRadius: 4 }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { bodyFont: { size: 13, weight: 600 }, callbacks: {
        label: ctx => `${data[ctx.dataIndex].n} signaux (${ctx.parsed.y.toFixed(1)}%)`
      } } },
      scales: {
        x: { ticks: { autoSkip: false, maxRotation: 60, minRotation: 60, font: { size: v.regional && data.length > 20 ? 12 : 14, weight: 700 }, color: '#1F2937' } },
        y: { ticks: { callback: val => val + '%', font: { size: 12, weight: 600 } } },
      },
    },
  });
}

function renderChartType(v, periodRows) {
  const counts = { Communautaires: 0, Hospitaliers: 0, "Centre d'appel": 0 };
  periodRows.forEach(r => { counts[typeSignal(r[5])]++; });
  const total = Object.values(counts).reduce((a,b)=>a+b,0) || 1;
  const colors = { Communautaires: '#0A2E0A', Hospitaliers: '#2E5EAA', "Centre d'appel": '#D97706' };
  const entries = Object.entries(counts).map(([name,value]) => ({ name, value, pct: value/total*100, color: colors[name] }));

  $(`${v.p}legend-type`).innerHTML = entries.map(d =>
    `<div style="display:flex; justify-content:space-between;">
      <span><span class="legend-dot" style="background:${d.color}"></span>${d.name}</span>
      <span style="font-weight:800;">${d.value} (${d.pct.toFixed(1)}%)</span>
    </div>`
  ).join('');

  const cle = `${v.p}type`;
  if (CHARTS[cle]) CHARTS[cle].destroy();
  CHARTS[cle] = new Chart($(`${v.p}chartType`), {
    type: 'doughnut',
    data: { labels: entries.map(d=>d.name), datasets: [{ data: entries.map(d=>d.value), backgroundColor: entries.map(d=>d.color) }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false },
      tooltip: { bodyFont: { size: 13, weight: 600 }, callbacks: { label: ctx => `${ctx.label}: ${ctx.parsed} (${entries[ctx.dataIndex].pct.toFixed(1)}%)` } } } },
  });
}

function renderTableEvents(v, periodRows, cumulRows, labelPeriode) {
  const verifPeriode = periodRows.filter(r => isVerifie(r[7]));
  const verifCumul = cumulRows.filter(r => isVerifie(r[7]));

  const classesPeriode = verifPeriode.filter(r => evenementFinal(r) !== 'Autres / inclassifiables');
  const classesCumul = verifCumul.filter(r => evenementFinal(r) !== 'Autres / inclassifiables');

  const countBy = rows => { const c = {}; rows.forEach(r => { const ev = evenementFinal(r); c[ev] = (c[ev]||0)+1; }); return c; };
  const cPeriode = countBy(classesPeriode), cCumul = countBy(classesCumul);

  let events = Array.from(new Set([...Object.keys(cPeriode), ...Object.keys(cCumul)]));
  events.sort((a,b) => (cCumul[b]||0) - (cCumul[a]||0));

  const totalPeriode = classesPeriode.length || 1, totalCumul = classesCumul.length || 1;
  $(`${v.p}table2-sub`).textContent =
    `${classesPeriode.length} évènements classés sur la période · ${classesCumul.length} en cumul`;

  const yr = MAX_DATE.slice(0,4);
  let html = `<thead><tr>
    <th style="background:#008000;text-align:left;">Événements</th>
    <th style="background:#008000;text-align:center;">Nbre (%) : ${labelPeriode}</th>
    <th style="background:#008000;text-align:center;">Cumul ${yr}</th>
  </tr></thead><tbody>`;
  events.forEach((ev,i) => {
    const p = cPeriode[ev]||0, c = cCumul[ev]||0;
    html += `<tr style="background:${i%2===0?'#FAFAF8':'#fff'};">
      <td style="font-weight:600;">${ev}</td>
      <td style="text-align:center; font-weight:700;">${p} (${(p/totalPeriode*100).toFixed(1)}%)</td>
      <td style="text-align:center; font-weight:700;">${c} (${(c/totalCumul*100).toFixed(1)}%)</td>
    </tr>`;
  });
  html += `<tr style="font-weight:800;">
    <td>Total</td>
    <td style="text-align:center;">${classesPeriode.length} (100%)</td>
    <td style="text-align:center;">${classesCumul.length} (100%)</td>
  </tr></tbody>`;
  $(`${v.p}table-events`).innerHTML = html;
}

// ------------------------------------------------------------
// TABLEAU DE PERFORMANCE / DÉLAIS DE TRAITEMENT
// Reproduit fidèlement le script R (base_periode -> tableau_final).
// row[9]=created, row[10]=verif_dt, row[11]=code_eval, row[12]=correspond
// ------------------------------------------------------------

function parseCorrespond(v) {
  if (typeof v === 'boolean') return v;
  const c = (v || '').toString().trim().toLowerCase();
  if (['true', '1', 'vrai', 'oui'].includes(c)) return true;
  if (['false', '0', 'faux', 'non'].includes(c)) return false;
  return null;
}

function diffHeures(dateA, dateB) {
  if (!dateA || !dateB || isNaN(dateA) || isNaN(dateB)) return null;
  return (dateA - dateB) / 36e5; // millisecondes -> heures
}

function calculerIndicateurs(row) {
  const notifDt = row[0] ? new Date(row[0] + 'T00:00:00') : null;
  const createdDt = row[9] ? new Date(row[9]) : null;
  const verifDt = row[10] ? new Date(row[10] + 'T00:00:00') : null;
  const codeVerif = (row[7] || '').trim().toUpperCase();
  const codeEval = (row[11] || '').trim().toUpperCase();
  const correspond = parseCorrespond(row[12]);

  const deltaNotifH = createdDt && notifDt ? Math.abs(diffHeures(createdDt, notifDt)) : null;
  const notifie24h = deltaNotifH !== null && deltaNotifH <= 24;

  const deltaVerifH = diffHeures(verifDt, notifDt);
  const verifie24h = codeVerif === 'HASVC' && deltaVerifH !== null && deltaVerifH >= 0 && deltaVerifH <= 24;

  const investigue48h = verifie24h; // même résultat, sur instruction explicite

  const transforme48h = correspond === true && deltaVerifH !== null && deltaVerifH >= 0 && deltaVerifH <= 48;

  const evaluationRisque = transforme48h && codeEval === 'HDREC';

  return { notifie24h, verifie24h, investigue48h, transforme48h, evaluationRisque };
}


function renderTableDelais(v, periodRows, labelPeriode) {
  const parUnite = {};
  periodRows.forEach(r => {
    const unite = (r[v.unitIdx] || '').trim();
    if (!unite) return;
    if (!parUnite[unite]) parUnite[unite] = {
      signaux: 0, notifies24h: 0, verifies24h: 0, investigues48h: 0, transformes48h: 0, evalues: 0,
    };
    const ind = calculerIndicateurs(r);
    const s = parUnite[unite];
    s.signaux++;
    if (ind.notifie24h) s.notifies24h++;
    if (ind.verifie24h) s.verifies24h++;
    if (ind.investigue48h) s.investigues48h++;
    if (ind.transforme48h) s.transformes48h++;
    if (ind.evaluationRisque) s.evalues++;
  });

  const unites = Object.keys(parUnite).sort((a, b) => a.localeCompare(b, 'fr'));
  const total = { signaux: 0, notifies24h: 0, verifies24h: 0, investigues48h: 0, transformes48h: 0, evalues: 0 };
  unites.forEach(u => {
    const s = parUnite[u];
    total.signaux += s.signaux; total.notifies24h += s.notifies24h; total.verifies24h += s.verifies24h;
    total.investigues48h += s.investigues48h; total.transformes48h += s.transformes48h; total.evalues += s.evalues;
  });

  const pct = (n, d) => d > 0 ? Math.round(100 * n / d) : 0;
  const cell = (n, d) => `${n} (${pct(n, d)} %)`;

  let html = `<thead><tr>
    <th style="background:#008000;text-align:left;">${v.unitLabel}</th>
    <th style="background:#008000;text-align:center;">Nombre de signaux notifiés</th>
    <th style="background:#008000;text-align:center;">Nombre de signaux notifiés dans les 24h</th>
    <th style="background:#008000;text-align:center;">% de signaux vérifiés dans les 24h</th>
    <th style="background:#008000;text-align:center;">% de signaux investigués dans les 48h</th>
    <th style="background:#008000;text-align:center;">% de signaux transformés en évènements dans les 48h</th>
    <th style="background:#008000;text-align:center;">% d'évènements ayant bénéficié d'une évaluation de risque</th>
  </tr></thead><tbody>`;

  unites.forEach((u, i) => {
    const s = parUnite[u];
    html += `<tr style="background:${i % 2 === 0 ? '#FAFAF8' : '#fff'};">
      <td style="font-weight:700;">${u}</td>
      <td style="text-align:center; font-weight:700;">${s.signaux}</td>
      <td style="text-align:center; font-weight:700;">${s.notifies24h}</td>
      <td style="text-align:center; font-weight:700;">${cell(s.verifies24h, s.signaux)}</td>
      <td style="text-align:center; font-weight:700;">${cell(s.investigues48h, s.signaux)}</td>
      <td style="text-align:center; font-weight:700;">${cell(s.transformes48h, s.signaux)}</td>
      <td style="text-align:center; font-weight:700;">${cell(s.evalues, s.transformes48h)}</td>
    </tr>`;
  });

  html += `<tr style="font-weight:800;">
    <td>Total</td>
    <td style="text-align:center;">${total.signaux}</td>
    <td style="text-align:center;">${total.notifies24h}</td>
    <td style="text-align:center;">${cell(total.verifies24h, total.signaux)}</td>
    <td style="text-align:center;">${cell(total.investigues48h, total.signaux)}</td>
    <td style="text-align:center;">${cell(total.transformes48h, total.signaux)}</td>
    <td style="text-align:center;">${cell(total.evalues, total.transformes48h)}</td>
  </tr></tbody>`;

  $(`${v.p}table-delais`).innerHTML = html;
  $(`${v.p}table-delais-sub`).textContent = labelPeriode;
}
</script>
